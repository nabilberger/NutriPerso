name: NutriPerso checks
on:
  push:
    branches: [main, "design/**", "feat/**", "codex/**", "test/**"]
  pull_request:
    branches: [main, "design/**", "feat/**"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build

  integration-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated PostgreSQL integration tests
        run: docker compose -p nutriperso-int -f docker-compose.integration.yml up --abort-on-container-exit --exit-code-from test
      - name: Stop only this test stack
        if: always()
        run: docker compose -p nutriperso-int -f docker-compose.integration.yml down --remove-orphans

  migration-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and test all seven migrations on isolated PostgreSQL
        run: docker compose -p nutriperso-migrations-int -f docker-compose.migrations.yml up --abort-on-container-exit --exit-code-from test
      - name: Stop only the migration test stack
        if: always()
        run: docker compose -p nutriperso-migrations-int -f docker-compose.migrations.yml down --remove-orphans

  ui-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:types:ui
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:ui:fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-fixtures-results
          path: |
            playwright-report/
            test-results/
