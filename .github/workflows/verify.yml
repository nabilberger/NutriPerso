name: NutriPerso checks
on:
  push:
    branches: [main, "design/**", "feat/**"]
  pull_request:
    branches: [main, "design/**"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
